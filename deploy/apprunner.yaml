AWSTemplateFormatVersion: "2010-09-09"
Description: Conductor web UI on AWS App Runner — a permanent public URL for the
  always-on ASGI service (React SPA + control loop) built from an ECR image.

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI (with tag) for the conductor web image.
  Provider:
    Type: String
    Default: bedrock
    AllowedValues: [bedrock, gemini]
    Description: LLM provider for the live agents.
  GeminiApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Gemini API key, used only when Provider=gemini. Passed at deploy
      time from the operator's .env; never stored in the repo.
  GeminiModel:
    Type: String
    Default: gemini-3.5-flash
    Description: Force every Gemini role onto one model (free-tier keys only have flash).

Resources:
  # App Runner assumes this role to pull the image from ECR.
  EcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: conductor-apprunner-ecr
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: build.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  # The running task assumes this role. Anonymous demo boards are in-memory, but
  # real (authenticated) tenants persist to the DynamoDB event log, so the task
  # needs read/write on that table. secretsmanager:GetSecretValue is granted so
  # the Gemini key can be moved out of a plaintext env var into Secrets Manager
  # (reference it via RuntimeEnvironmentSecrets) without another role change.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: conductor-apprunner-instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: tasks.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: conductor-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:GetItem, dynamodb:BatchWriteItem]
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/conductor-events"
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:conductor/*"
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource: "*"

  AutoScaling:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: conductor-web1
      # Anonymous demo boards are in-memory, so a visitor must return to the same
      # instance. Pinned to one instance (min = max = 1); real tenants persist to
      # DynamoDB and would tolerate more, but the public demo is single-instance.
      MinSize: 1
      MaxSize: 1
      MaxConcurrency: 100

  Service:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: conductor-web
      AutoScalingConfigurationArn: !Ref AutoScaling
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt EcrAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref ImageUri
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8080"
            RuntimeEnvironmentVariables:
              - Name: CONDUCTOR_REQUIRE_AUTH
                Value: "0"                 # public demo: every request is the demo tenant
              - Name: CONDUCTOR_AWS_PROFILE
                Value: ""                  # no local profile in the cloud
              - Name: CONDUCTOR_WORK_DIR
                Value: "/tmp/conductor-work"
              - Name: CONDUCTOR_PROVIDER
                Value: !Ref Provider
              - Name: CONDUCTOR_GEMINI_MODEL
                Value: !Ref GeminiModel
              - Name: GEMINI_API_KEY
                Value: !Ref GeminiApiKey
              - Name: CONDUCTOR_TABLE
                Value: conductor-events    # durable log for real tenants (demo boards stay in-memory)
      InstanceConfiguration:
        Cpu: "1024"                        # 1 vCPU
        Memory: "2048"                     # 2 GB
        InstanceRoleArn: !GetAtt InstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /api/health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5

Outputs:
  ServiceUrl:
    Description: The permanent public URL for the Conductor web UI.
    Value: !Sub "https://${Service.ServiceUrl}"
