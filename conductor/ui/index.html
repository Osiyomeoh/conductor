<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conductor</title>
<style>
:root{
  --ink:#12151c; --paper:#f4f5f8; --card:#fff; --line:#dde1e9; --mid:#5b6478;
  --faint:#8c93a3; --accent:#4c5fd7; --accent-soft:#eef0fc;
  --pass:#1f8a70; --fail:#b3452c; --held:#9a6b12; --grid:#e8ebf1;
}
@media (prefers-color-scheme:dark){:root{
  --ink:#e6e9f0; --paper:#0d1117; --card:#151a23; --line:#28303d; --mid:#98a1b4;
  --faint:#6c7689; --accent:#8a97ec; --accent-soft:#1b2240;
  --pass:#4bbd9c; --fail:#e08163; --held:#d8a949; --grid:#1e2530;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:400 14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
header{padding:26px 28px 20px;border-bottom:1px solid var(--line);background:var(--card)}
h1{margin:0;font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);font-weight:600;font-family:ui-monospace,Menlo,monospace}
.headline{margin:12px 0 4px;font-size:29px;font-weight:600;letter-spacing:-.02em}
.sub{color:var(--mid);font-size:14px}
main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);
  gap:22px;padding:22px 28px 60px;max-width:1400px}
@media(max-width:960px){main{grid-template-columns:1fr}}
section{margin-bottom:26px}
h2{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
  margin:0 0 10px;font-family:ui-monospace,Menlo,monospace;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:16px}
.q{background:var(--card);border:1px solid var(--held);border-left:3px solid var(--held);
  border-radius:9px;padding:18px;margin-bottom:12px}
.q h3{margin:0 0 6px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.qmeta{color:var(--mid);font-size:12.5px;margin-bottom:14px}
.qmeta b{color:var(--ink);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);padding:8px 13px;transition:.12s}
button:hover{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opts button{border-color:var(--accent);color:var(--accent);font-weight:500}
.opts button:hover{background:var(--accent);color:#fff}
.empty{color:var(--pass);font-size:15px;padding:22px 16px;text-align:center;
  border:1px dashed var(--line);border-radius:9px;background:var(--card)}
.empty span{display:block;color:var(--faint);font-size:12.5px;margin-top:5px}
table{width:100%;border-collapse:collapse}
td{padding:8px 10px 8px 0;border-bottom:1px solid var(--grid);vertical-align:top}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;padding:2.5px 7px;border-radius:4px;
  border:1px solid currentColor;white-space:nowrap}
.done{color:var(--pass)} .rejected,.escalated{color:var(--fail)}
.held{color:var(--held)} .dispatched,.claimed_done{color:var(--accent)}
.pending,.blocked{color:var(--faint)}
.t{font-weight:500} .why{color:var(--mid);font-size:12px;margin-top:2px}
.spec{color:var(--faint);font-size:10.5px;font-family:ui-monospace,Menlo,monospace}
.meter{height:7px;background:var(--grid);border-radius:4px;overflow:hidden;margin:7px 0 4px}
.meter i{display:block;height:100%;background:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13px}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.log{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--mid);
  max-height:230px;overflow:auto}
.log div{padding:2.5px 0;border-bottom:1px solid var(--grid)}
.bar{display:flex;gap:9px;align-items:center;margin-top:16px}
.note{color:var(--faint);font-size:12px}
</style>

<header>
  <h1>Conductor</h1>
  <div class="headline" id="headline">Loading</div>
  <div class="sub" id="sub"></div>
  <div class="bar">
    <button onclick="tick(1)">Advance one tick</button>
    <button onclick="tick(6)">Run six</button>
    <span class="note" id="compression"></span>
  </div>
</header>

<main>
  <div>
    <section>
      <h2>Needs you</h2>
      <div id="decisions"></div>
    </section>
    <section>
      <h2>Board</h2>
      <div class="card"><table id="board"></table></div>
    </section>
  </div>

  <div>
    <section>
      <h2>Attention</h2>
      <div class="card" id="attention"></div>
    </section>
    <section>
      <h2>Cost</h2>
      <div class="card" id="cost"></div>
    </section>
    <section>
      <h2>Trust</h2>
      <div class="card" id="trust"></div>
    </section>
    <section>
      <h2>Log</h2>
      <div class="card log" id="log"></div>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

function render(s){
  const n = s.decisions.length;
  $("headline").textContent = n === 0 ? "Nothing needs you."
    : n === 1 ? "One thing needs you." : `${n} things need you.`;
  const m = s.metrics;
  $("sub").textContent =
    `${m.verified} verified · ${m.claims_rejected} claims rejected before you saw them · ${m.held} held for capacity`;
  $("compression").textContent = s.compression;

  $("decisions").innerHTML = n === 0
    ? `<div class="empty">The loop is running.<span>Verifying, recovering and dispatching. You will hear from it when there is a judgment call.</span></div>`
    : s.decisions.map(d => `
      <div class="q">
        <h3>${esc(d.question)}</h3>
        <div class="qmeta">
          unblocks <b>${d.unblocks}</b> items${d.compressed_from > 1
            ? ` · compressed from <b>${d.compressed_from}</b> escalations` : ""}
          ${d.branches ? ` · <b>${d.prebuilt}</b> of ${d.branches} branches already built and verified · $${d.spent.toFixed(4)} spent` : ""}
        </div>
        ${d.needs_framing
          ? `<div class="note">No options yet. This one needs framing before anyone can answer it, so nothing was speculated against it.</div>`
          : `<div class="opts">${d.options.map(o =>
              `<button onclick="answer('${d.id}', ${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join("")}</div>`}
      </div>`).join("");

  $("board").innerHTML = s.board.map(c => `
    <tr>
      <td style="width:118px"><span class="pill ${c.status}">${c.status.replace("_"," ")}</span></td>
      <td>
        <div class="t">${esc(c.title)} ${c.speculative ? '<span class="spec">SPEC</span>' : ""}</div>
        <div class="why">${esc(c.reason)}</div>
      </td>
      <td style="width:92px" class="mono spec">${esc(c.owner || "")}</td>
      <td style="width:52px" class="mono spec num">${c.review_cost}m</td>
    </tr>`).join("");

  $("attention").innerHTML = s.attention.map(a => {
    const used = a.total ? Math.round((a.spent + a.committed) / a.total * 100) : 0;
    return `<div class="kv"><span>${esc(a.reviewer)}</span><b>${a.remaining}m free</b></div>
      <div class="meter"><i style="width:${used}%"></i></div>
      <div class="note">${a.spent}m spent · ${a.committed}m in flight · ${a.total}m budget</div>`;
  }).join("") || '<div class="note">no reviewers yet</div>';

  const c = s.cost;
  $("cost").innerHTML = `
    <div class="kv"><span>on work that passed</span><b style="color:var(--pass)">$${c.verified.toFixed(4)}</b></div>
    <div class="kv"><span>on claims that failed</span><b style="color:var(--fail)">$${c.rejected.toFixed(4)}</b></div>
    <div class="kv"><span>on discarded branches</span><b>$${c.discarded.toFixed(4)}</b></div>
    <div class="kv" style="border-top:1px solid var(--grid);margin-top:6px;padding-top:9px">
      <span>per verified item</span><b>$${c.per_verified.toFixed(4)}</b></div>
    <div class="note" style="margin-top:8px">failed claims were never reviewed by a person</div>`;

  $("trust").innerHTML = s.trust.map(t => `
    <div class="kv"><span>${esc(t.worker)}${t.principal ? ` <span class="note">for ${esc(t.principal)}</span>` : ""}</span>
      <span class="pill ${t.probation && t.type === "agent" ? "held" : "done"}">${
        t.type === "agent" ? (t.probation ? "probation" : "trusted") : "human"}</span></div>
    <div class="note mono">${esc(t.detail)}</div>`).join("");

  $("log").innerHTML = s.events.map(e => `<div>${esc(e)}</div>`).join("");
}

async function load(){ render(await (await fetch("/api/state")).json()); }
async function post(path, body){
  render(await (await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body)})).json());
}
const answer = (id, choice) => post("/api/answer", {decision_id:id, choice});
const tick = ticks => post("/api/tick", {ticks});
load(); setInterval(load, 4000);
</script>
